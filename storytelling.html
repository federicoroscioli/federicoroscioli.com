<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Storytelling — Federico Roscioli</title>

<style>
  :root {
    --bg: #f6f1eb;
    --surface: #efe9e0;
    --surface2: #e8e0d5;
    --text: #211a10;
    --muted: #7a6a55;
    --accent: #8b4a2b;
    --accent-hover: #6e3a20;
    --border: #d4c9b8;
    --border-light: #ddd5c5;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { font-size: 16px; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Georgia', 'Times New Roman', serif;
    line-height: 1.75;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── NAV ── */
  nav {
    background: var(--text);
    color: var(--bg);
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 48px;
    height: 52px;
  }
  nav .logo {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 0.78rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--bg);
    text-decoration: none;
    font-weight: 700;
  }
  nav ul { list-style: none; display: flex; gap: 32px; }
  nav ul a {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 0.72rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #c8bfaf;
    text-decoration: none;
    transition: color 0.2s;
  }
  nav ul a:hover, nav ul a.active { color: var(--bg); }

  /* ── PLACEHOLDER ── */
  .placeholder {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 56px 48px;
  }
  .placeholder-inner { max-width: 560px; text-align: center; }
  .page-eyebrow {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 0.72rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  .page-eyebrow::before, .page-eyebrow::after {
    content: '';
    display: block;
    width: 28px;
    height: 1px;
    background: var(--accent);
    flex-shrink: 0;
  }
  .placeholder h1 {
    font-size: 2.6rem;
    font-weight: normal;
    letter-spacing: -0.02em;
    line-height: 1.1;
    margin-bottom: 20px;
  }
  .placeholder p {
    font-size: 1rem;
    color: #4a3c28;
    line-height: 1.85;
    margin-bottom: 28px;
  }
  .btn-ghost {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 0.74rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    text-decoration: none;
    border-bottom: 1px solid var(--border);
    padding-bottom: 2px;
    transition: color 0.2s, border-color 0.2s;
  }
  .btn-ghost:hover { color: var(--text); border-color: var(--text); }

  /* ── FOOTER ── */
  footer {
    background: var(--text);
    color: #7a6a55;
    text-align: center;
    padding: 20px 48px;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 0.72rem;
    letter-spacing: 0.06em;
  }
  footer a { color: #9a8a75; text-decoration: none; }
  footer a:hover { color: var(--bg); }

  /* ── RESPONSIVE ── */
  @media (max-width: 700px) {
    nav { padding: 0 20px; }
    nav ul { gap: 16px; }
    .placeholder { padding: 40px 20px; }
    .placeholder h1 { font-size: 2rem; }
  }
</style>
</head>
<body>
